/* Responsive team cards: readable names and consistent roster slots. */
#teams.cards{grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;align-items:stretch}
#teams .card{padding:20px;background:#fffefa;border:1px solid #dfd8cb;border-top:3px solid #b89962;border-radius:12px;box-shadow:0 2px 5px #30241405}
#teams .card h3{font-size:18px;gap:10px;margin:0 0 16px;min-height:38px}
#teams .team-logo{width:34px;height:34px;font-size:18px;border-radius:8px;background:#f0ebe2}
#teams .team-metrics{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-top:1px solid #eee7dc;border-bottom:1px solid #eee7dc;gap:12px}
#teams .team-budget,#teams .team-count{display:flex;flex-direction:column;gap:4px}
#teams .team-count{text-align:right}
#teams .team-metrics small{font-size:12px;color:#847b6c;font-weight:400}
#teams .team-budget>strong{font-size:26px;color:#a52d2d;line-height:1.15;font-weight:650}
#teams .team-count>strong{font-size:20px;font-weight:600;color:#343029}
#teams .badge{font-size:12px;color:#7c7262;font-weight:500;margin:12px 0 0}
#teams .members{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
#teams .members>span{height:58px;min-height:58px;padding:7px 5px;border:1px solid #e9e3d9;border-radius:8px;background:#f7f4ee;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
#teams .members>span.muted{color:#aaa191;background:transparent;border:1px dashed #ded6c8;font-size:12px}
#teams .members>span.playing-coach{border:1px solid #b58a3e;background:#fbf3df;color:#71541f}
#teams .playing-coach strong{font-size:13px;font-weight:600;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#teams .playing-coach small{font-size:10px;line-height:1.1;color:#98752f}
#teams .coach{border:0;padding:0;margin:-6px 0 12px;color:#82745d;font-size:12px}
#teams .card.leading{border-color:#bf4545;box-shadow:0 0 0 1px #bf4545}
#teams .card.responding{box-shadow:0 0 0 2px #bd9a5d}
@media(min-width:1450px){#teams.cards{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:1000px){#teams.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:580px){#teams.cards{grid-template-columns:1fr}#teams .card{padding:16px}#teams .members>span{height:54px;min-height:54px}}

/* Configuration form layout: bounded fields, shared control sizes. */
#setup{background:#eee8dd;padding:22px;border-radius:12px;min-width:0}
#setup h2{font-size:21px;margin:4px 0 10px}
#setup>.muted{margin:0 0 18px;line-height:1.6}
#setup .config{gap:12px;margin-bottom:18px}
#setup .team-input{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 18px;padding:18px;background:#fffefa;border:1px solid #e3dccf;border-radius:10px}
#setup .team-input .team-config-title{grid-column:1/-1;display:flex;align-items:center;gap:9px;margin:0;padding-bottom:12px;border-bottom:1px solid #eee7dc;font-size:15px;color:#332c21}
#setup label{min-width:0;gap:7px;font-size:12px;color:#766b5a;align-content:start}
#setup input:not([type=checkbox]),#setup select,#setup textarea{width:100%;min-width:0;max-width:100%;margin:0;border:1px solid #d9d1c4;background:#fff;border-radius:6px;color:#29251f;font-size:14px;box-sizing:border-box;box-shadow:none}
#setup input:not([type=checkbox]),#setup select{height:40px;padding:8px 10px}
#setup input[type=checkbox]{width:16px;height:16px;min-width:16px;margin:0;accent-color:#ae3434;vertical-align:middle}
#setup input[readonly]{background:#f1eee8;color:#8b8173}
#setup input:focus,#setup select:focus,#setup textarea:focus{outline:2px solid #b89a6255;outline-offset:1px;border-color:#b89a62}
#setup .candidate{display:grid;grid-template-columns:minmax(125px,1fr) 100px minmax(0,2fr);gap:12px 18px;align-items:start;margin:10px 0;padding:16px 18px;border:1px solid #e3dccf;border-radius:10px;background:#fffefa;min-width:0}
#setup .candidate>label:first-child{align-self:center;font-size:14px;color:#332c21}
#setup .candidate>label:first-child>span{display:flex;align-items:center;gap:9px;overflow-wrap:anywhere}
#setup .candidate textarea{height:64px;min-height:64px;padding:9px 10px;resize:vertical;line-height:1.5}
#setup .history-config{grid-column:1/-1;border-top:1px solid #eee7dc;margin:0;padding-top:10px;min-width:0}
#setup .history-config summary{font-size:12px;color:#88734d;cursor:pointer;padding:2px 0}
#setup .history-config label{display:inline-grid;width:calc(50% - 12px);min-width:0;margin:8px 12px 0 0;vertical-align:top}
#setup .history-config p{font-size:12px;margin:10px 0;line-height:1.5}
#capacity-summary{padding:12px 14px;background:#e7dfd0;border-radius:7px;font-size:13px;margin:16px 0 24px;color:#69583b}
#setup>p:last-child label{max-width:160px}
@media(max-width:650px){#setup{padding:14px}#setup .team-input{grid-template-columns:repeat(2,minmax(0,1fr));padding:14px;gap:12px}#setup .candidate{grid-template-columns:minmax(0,1fr) 100px;padding:14px;gap:12px}#setup .candidate>label:nth-child(3){grid-column:1/-1}#setup .history-config label{display:grid;width:100%;margin-right:0}}


#setup .candidate-tools{background:#fffefa;border:1px solid #ded6c8;border-radius:9px;padding:14px;margin:14px 0 10px}
#setup .candidate-filter,#setup .candidate-batch{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
#setup .candidate-filter input{flex:1;min-width:150px;max-width:340px}#setup .candidate-filter select{width:125px}#candidate-count{font-size:12px;color:#817560}

#setup .candidate-extra{min-width:0}#setup .candidate-extra>summary{font-size:12px;color:#8a6d37;cursor:pointer;padding:7px 0}
#setup .candidate-extra[open]{grid-column:1/-1;border-top:1px solid #eee7dc;padding-top:6px}#setup .candidate-extra-body{padding:8px 0;display:grid;grid-template-columns:1fr;gap:10px}#setup .candidate-extra-body textarea{min-height:65px}
@media(max-width:650px){#setup .candidate{grid-template-columns:minmax(90px,1fr) 100px;gap:8px}#setup .candidate-extra{grid-column:1/-1}#setup .candidate-extra:not([open]){border:0}#setup .candidate-batch{gap:7px}}

.draft-ink-header{min-height:280px;padding:34px 42px;background-position:center 55%;border-radius:12px}
.draft-ink-copy{max-width:90%}
.draft-ink-header #name{margin:0 0 22px;line-height:1.1;font-weight:900;color:#211e19;letter-spacing:0}
.draft-title-eyebrow{display:block;font-family:system-ui,sans-serif;font-size:14px;font-weight:600;letter-spacing:.28em;color:#72604a;margin:0 0 14px}
.draft-title-main{display:flex;align-items:baseline;gap:22px;font-family:'Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun',serif;font-size:clamp(42px,5.2vw,76px);font-weight:900;letter-spacing:.04em;text-shadow:0 .5px 0 currentColor}
.draft-title-season{color:#a83127;font-family:Georgia,'Times New Roman',serif;font-size:1.15em;letter-spacing:-.065em;font-weight:700;line-height:1}
.draft-ink-header .phase{display:inline-block;border-left:3px solid #a83127;padding-left:12px;font-size:15px;font-weight:600;color:#4b3c2c}
.draft-ink-header #progress{padding-left:15px;color:#7e6f5b;font-size:12px}

#admin-choices{padding:18px;background:#fffaf0;border:1px solid #d7bf92;border-radius:9px}#admin-choices h3{margin:0 0 12px;font-size:16px}#admin-choices small{font-size:12px;color:#8a7046;font-weight:400}.admin-choice-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:8px}.admin-choice-list>div{display:flex;justify-content:space-between;gap:12px;padding:10px;border-bottom:1px solid #eee5d6;font-size:14px}
.admin-choice-list>div{flex-wrap:wrap;align-items:center}.admin-choice-list select{min-width:120px;flex:1;font-size:13px}.admin-choice-list button{font-size:12px;padding:7px 10px}.admin-choice-list strong{width:100%}

#feed{margin-top:30px;line-height:1.5}.results-heading{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px}.results-heading h2{font:600 24px serif;margin:0}.results-heading>span{font-size:12px;color:#8a7e6a}

render=function(){['teams','bar','feed'].forEach(id=>$(id).hidden=false);oldRender();document.body.classList.toggle('coach-view',!!state.myTeam&&!state.manager);document.body.classList.toggle('board-view',!!state.draft&&!configOpen);$('draft-sidebar').append($('auction'),$('pick')); if(state.myTeam&&!state.manager)$('auction').before($('pick'));else $('auction').after($('pick'));$('more').hidden=!state.manager;$('setup').hidden=!configOpen||state.status!=='setup'||!state.manager;$('more-panel').innerHTML=state.manager?'<b>'+ (state.public?'已公开 · 任何人可只读访问':'私有 · 仅管理员和绑定教练可访问')+'</b><p><button id="visibility">'+(state.public?'关闭公开访问':'公开给观众')+'</button>'+(state.status==='setup'?'<button id="configure-toggle">'+(configOpen?'收起配置':'编辑配置')+'</button><button id="refresh-config">刷新配置</button>':'')+(state.draft?'<button id="edit-candidates">选手定价 / 介绍</button><button id="rollback-stage">回退上一阶段</button>':'')+(state.status!=='complete'?'<button id="undo-control">撤销上一步 · 先预览</button>':'')+((state.status==='setup'||state.status==='complete')&&state.eventId?'<button id="unlink-control">解除赛事关联</button>':'')+'</p>':'';if($('visibility'))$('visibility').onclick=async()=>{if(!state.public&&!await askConfirm('公开后，任何持有活动链接的人可查看名单和已公布选人信息。确认公开？'))return;send('publish',{public:!state.public})};if($('configure-toggle'))$('configure-toggle').onclick=()=>{configOpen=!configOpen;render()};if($('refresh-config'))$('refresh-config').onclick=async()=>{if(await askConfirm('刷新会放弃尚未保存的配置输入，继续？'))load(true)};if($('edit-candidates'))$('edit-candidates').onclick=editCandidates;if($('rollback-stage')){$('rollback-stage').hidden=!!state.canRollbackImport;$('rollback-stage').onclick=()=>controlPreview('rollback')}if($('undo-control'))$('undo-control').onclick=()=>controlPreview('undo');if($('unlink-control'))$('unlink-control').onclick=async()=>{if(await askConfirm(state.status==='setup'?'解除关联会清空当前配置，审计保留。继续？':'解除关联保留最终阵容和审计，并允许在赛事管理中清理符合条件的测试赛事。继续？'))send('unlink')};
if(state.status==='setup'&&state.manager&&!configOpen){$('bar').querySelector('#save')?.remove();$('bar').insertAdjacentHTML('beforeend','<button id="open-config">编辑配置</button>');$('open-config').onclick=()=>{configOpen=true;render()}}
const d=state.draft;if(d){document.querySelectorAll('#teams .card').forEach((card,i)=>{const t=d.teams[i];const h=card.querySelector('h3');h.innerHTML=logo(t.teamId)+'<span>'+esc(team(t.teamId))+'</span>';const selectedTeam=d.lot?.outcome==='assigned'?d.lot.assignedTeam:d.lot?.leader;card.classList.toggle('leading',selectedTeam===t.teamId&&! (d.lot?.outcome==='unsold'));if(d.lot?.state==='settled'&&selectedTeam===t.teamId&&d.lot.outcome!=='unsold'){card.querySelector('.badge').textContent='本轮成交';card.querySelector('.badge').classList.add('settled-badge')}else if(['auction-ready','auction','third-ready','review-ready'].includes(d.phase)&&teamIsFull(t.teamId))card.querySelector('.badge').textContent='已满员 · 自动 PASS';else if(card.querySelector('.badge').textContent==='本选手 PASS')card.querySelector('.badge').textContent='本轮已 PASS';card.classList.toggle('responding',d.lot?.turn===t.teamId);if(d.lot?.leader===t.teamId&&d.lot.state==='awaiting-confirm'){const preview=document.createElement('p');preview.className='badge';preview.textContent='成交后余额 '+(t.balance-d.lot.price);card.appendChild(preview)}});
if(state.manager&&state.status==='active'&&(['auction-ready','third-ready','review-ready'].includes(d.phase)||(d.phase==='auction'&&(['settled','preview','awaiting-confirm'].includes(d.lot?.state))))){$('bar').insertAdjacentHTML('beforeend','<button id="finish-control">最终检查 / 结束</button>');$('finish-control').onclick=()=>controlPreview('finish')}
if(state.status==='complete'){$('phase').textContent='选人活动已结束';$('progress').textContent='最终阵容已一次性导入原赛事，可回滚本次导入。';$('bar').innerHTML='<strong>活动已结束 · 最终阵容</strong>';if(state.canRollbackImport){$('bar').insertAdjacentHTML('beforeend','<button id="rollback-import">回滚本次导入</button>');$('rollback-import').onclick=()=>controlPreview('rollback-import')};if(d.completion?.unassigned?.length)$('progress').textContent+=' 未分队：'+d.completion.unassigned.map(p=>p.name).join('、')}}
};
function editCandidates(){
 const editRevision=state.revision;const box=$('preview-panel');box.classList.remove('finish-review');box.removeAttribute('aria-labelledby');box.hidden=false;
 box.innerHTML='<h2>选手定价与介绍</h2><p>起拍价修改用于后续竞拍；已开始的竞价和已成交金额保持原记录。</p><input id="live-candidate-search" placeholder="搜索选手姓名"><div id="live-candidate-list">'+state.draft.candidates.map(c=>'<div data-live-player="'+esc(c.playerId)+'" style="display:grid;grid-template-columns:120px 100px 1fr;gap:12px;margin:12px 0;align-items:center"><strong>'+esc(player(c.playerId))+'</strong><label>起拍价<input type="number" min="0" max="1000000" value="'+c.startPrice+'"></label><label>介绍<textarea maxlength="2000">'+esc(c.description||'')+'</textarea></label></div>').join('')+'</div><button id="save-live-candidates" class="primary">保存资料</button> <button id="close-live-candidates">取消</button>';
 $('live-candidate-search').oninput=e=>box.querySelectorAll('[data-live-player]').forEach(row=>row.style.display=player(row.dataset.livePlayer).toLowerCase().includes(e.target.value.trim().toLowerCase())?'grid':'none');
 $('close-live-candidates').onclick=()=>box.hidden=true;
 $('save-live-candidates').onclick=async()=>{const rows=[...box.querySelectorAll('[data-live-player]')];if(rows.some(row=>!row.querySelector('input').reportValidity()||row.querySelector('input').value===''))return;const candidates=rows.map(row=>({playerId:row.dataset.livePlayer,startPrice:Number(row.querySelector('input').value),description:row.querySelector('textarea').value}));await send('edit-candidates',{candidates,revision:editRevision});if($('error').style.display==='none')box.hidden=true};
}
function finishReviewMarkup(p){const teams=p.teams||[],count=teams.reduce((n,t)=>n+t.count,0),capacity=teams.reduce((n,t)=>n+t.capacity,0),balance=teams.reduce((n,t)=>n+t.balance,0);return '<div class="finish-heading"><div><span>指名大会 · 收尾确认</span><h2 id="finish-title">最终阵容检查</h2></div><button id="cancel-control" aria-label="关闭最终检查">关闭</button></div><div class="finish-body"><div class="finish-stats"><div><small>已入队人数</small><strong>'+count+'<span> / '+capacity+'</span></strong></div><div class="'+(p.vacancies?'has-vacancy':'')+'"><small>剩余空缺</small><strong>'+p.vacancies+'<span> 人</span></strong></div><div><small>队伍剩余预算合计</small><strong>'+balance+'<span> 点</span></strong></div></div><p class="finish-notice">'+esc(p.message)+'</p><div class="finish-team-grid">'+teams.map(t=>'<article class="finish-team '+(t.count<t.capacity?'short-team':'')+'"><div class="finish-team-heading">'+logo(t.teamId)+'<strong>'+esc(t.name)+'</strong><span>'+ (t.count<t.capacity?'缺 '+(t.capacity-t.count)+' 人':'已满员')+'</span></div><div class="finish-team-meta"><span>阵容 '+t.count+' / '+t.capacity+'</span><span>余额 <b>'+t.balance+'</b></span></div><div class="finish-members">'+t.members.map(n=>'<span>'+esc(n)+'</span>').join('')+'</div></article>').join('')+'</div>'+(p.unassigned?.length?'<div class="finish-notice">未分队选手：'+p.unassigned.map(x=>esc(x.name)).join('、')+'</div>':'')+'</div><div class="finish-actions"><span>'+(p.vacancies?'仍有空缺，请核对后确认':'阵容检查已完成')+'</span><button id="finish-cancel">取消</button><button id="confirm-control" class="primary">结束并导入赛事</button></div>'}
async function controlPreview(operation){try{const r=await request('/api/draft/'+id+'/',{action:'preview',operation,revision:state.revision}),p=r.preview;const box=$('preview-panel');box.classList.toggle('finish-review',operation==='finish');box.hidden=false;box.innerHTML='<h2>'+(operation==='finish'?'最终检查':operation==='rollback'?'回退阶段影响预览':operation==='rollback-import'?'整批导入回滚预览':'撤销影响预览')+'</h2><p>'+esc(p.message)+'</p>'+(p.teams?'<ul>'+p.teams.map(t=>'<li>'+esc(t.name)+' · '+t.count+'/'+t.capacity+'人 · 余额 '+t.balance+'<br>'+t.members.map(esc).join('、')+'</li>').join('')+'</ul>':'')+(p.rosterChanges?'<p>将恢复到：'+esc(({setup:'准备',nomination:'一选提交',revealed:'一选公布',auction:'竞拍','auction-ready':'待抽取','third-ready':'第三轮待抽取','review-ready':'最终检查'})[p.phase]||'上一步')+' · 撤销 '+esc(({configure:'保存配置',start:'开始一选',nominate:'提交首选','admin-nominate':'管理员更正首选',reveal:'公布选择',roll:'冲突Roll',continue:'推进一选',draw:'抽取选手','draw-third':'抽取第三轮选手','open-bidding':'开始竞拍',bid:'报价',pass:'PASS','confirm-lot':'确认成交或流拍','assign-third':'确认分派','assign-second':'管理员分配','admin-third':'第三轮管理员指定','mark-unsold':'管理员确认流拍','rollback':'本阶段及后续操作','rollback-import':'整批导入','next-lot':'下一位'})[p.action]||'上一步操作')+'</p><ul>'+p.rosterChanges.map(r=>'<li>'+esc(r.player)+'：'+esc(r.fromTeam?team(r.fromTeam):'未分队')+' → '+esc(r.toTeam?team(r.toTeam):'未分队')+'</li>').join('')+'</ul><p>恢复余额：'+p.balances.map(t=>esc(team(t.teamId))+' '+t.balance).join(' / ')+'</p>':'')+(p.unassigned?.length?'<p>保持未分队：'+p.unassigned.map(x=>esc(x.name)).join('、')+'</p>':'')+'<button id="confirm-control" class="primary">确认'+(operation==='finish'?'结束活动':operation==='rollback'?'回退阶段':operation==='rollback-import'?'回滚导入':'撤销')+'</button> <button id="cancel-control">取消</button>';if(operation==='finish'){box.innerHTML=finishReviewMarkup(p);box.setAttribute('role','dialog');box.setAttribute('aria-modal','true');box.setAttribute('aria-labelledby','finish-title');$('finish-cancel').onclick=()=>box.hidden=true}else{box.removeAttribute('aria-modal');box.removeAttribute('aria-labelledby')} $('cancel-control').onclick=()=>box.hidden=true;box.onkeydown=e=>{if(e.key==='Escape'){box.hidden=true;$('finish-control')?.focus()}if(e.key==='Tab'&&operation==='finish'){const items=[...box.querySelectorAll('button:not(:disabled)')],first=items[0],last=items.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}};if(operation==='finish')$('cancel-control').focus();$('confirm-control').onclick=async()=>{box.hidden=true;await send(operation,{previewToken:p.token})};box.scrollIntoView({behavior:'smooth',block:'center'})}catch(e){error(e)}}

const renderBeforeStageLabels=render;
render=function(){const moreButton=$('more');document.querySelector('header').append(moreButton);renderBeforeStageLabels();$('bar').append(moreButton);moreButton.textContent='更多操作';moreButton.setAttribute('aria-controls','more-panel');moreButton.setAttribute('aria-expanded',String(!$('more-panel').hidden));if(!state.manager)$('more-panel').hidden=true;const d=state.draft;if(!d)return;const l=d.lot,phase=d.phase,third=phase==='third-ready'||(phase==='auction'&&l?.stage===3),second=phase==='auction-ready'||(phase==='auction'&&l?.stage!==3);
if(second||third){$('phase').textContent=third?'第三轮 · 补选分派':'第二轮 · 竞拍分配';const pool=d.candidates.filter(c=>c.state===(third?'third-pool':'available')).length,unsettled=l&&l.state!=='settled',remaining=Math.max(0,pool-(unsettled?1:0));

else{$('progress').textContent=(l?(l.state==='settled'?'本选手已处理':'当前选手处理中'):'等待抽取选手')+' · '+remaining+' 人待抽取';if($('next-lot'))$('next-lot').textContent='下一位选手'}

};
