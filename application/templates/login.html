<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录 · {{ venue_name }}赛事管理程序</title><link rel="stylesheet" href="/assets/manager.css"></head><body class="login-page"><main class="login card"><div class="eyebrow">{{ venue_english }}</div><h1>{{ venue_name }}赛事管理程序</h1><p class="login-subtitle">账号登录</p><form method="post" id="login-form">{% csrf_token %}<label>用户名<input name="username" autocomplete="username" maxlength="150" value="{{ username }}" required></label><label>密码<input type="password" name="password" autocomplete="current-password" required></label>{% if error %}<p class="login-error" role="alert">{{ error }}</p>{% endif %}<button type="submit">登录</button></form><a class="login-public" href="/">查看公开赛事 →</a></main>{% include 'site-credit.html' %}<script>
(()=>{
 const form=document.getElementById('login-form');
 function refreshToken(){
  const name=(window.HQL_BRAND?.csrfCookie||'csrftoken')+'=';
  const cookie=document.cookie.split(';').map(v=>v.trim()).find(v=>v.startsWith(name));
  if(cookie){form.elements.csrfmiddlewaretoken.value=decodeURIComponent(cookie.slice(name.length))}
 }
 window.addEventListener('pageshow',refreshToken);
 form.addEventListener('submit',refreshToken);
})();
</script></body></html>
