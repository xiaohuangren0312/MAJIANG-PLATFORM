<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#272522"><meta name="description" content="{{ venue_name }}赛事展示：赛程赛果、队伍积分与选手表现。"><title>{{ venue_name }}赛事 · 观众端</title><link rel="stylesheet" href="/assets/public.css"><link rel="stylesheet" href="/assets/red-white.css"><link rel="stylesheet" href="/assets/ink-ivory.css"><link rel="stylesheet" href="/assets/viewer-design.css?v=20261012"></head><body>
<header class="site-header"><a href="#home" class="brand" aria-label="{{ venue_name }}赛事首页"><img class="brand-tile" src="/brand/logo" alt="{{ venue_name }}Logo" width="40" height="40" style="object-fit:contain"><span>{{ venue_name }}<small>RIICHI TOURNAMENTS</small></span></a><nav id="desktop-nav" aria-label="主要导航"></nav>{% if request.user.is_authenticated %}<div class="public-account-actions">{% include "account-identity.html" %}</div>{% else %}<a class="account-link" href="/login/">登录</a>{% endif %}</header>
<section id="event-banner" class="event-banner" aria-label="当前赛事" hidden><div class="event-banner-inner"><div class="event-banner-copy"><h2 id="event-banner-name"></h2><p id="event-banner-subtitle"></p></div><div class="event-banner-seal" aria-hidden="true">雀</div></div></section>
<div class="context-bar"><label>正在关注<select id="event-select" aria-label="选择赛事"></select></label><span id="context-info"></span></div>
<main id="content"><div class="empty">正在读取赛事信息…</div></main><nav id="mobile-nav" aria-label="手机导航"></nav>
<footer class="site-footer"><strong>{{ venue_name }}赛事</strong><span>{{ venue_tagline }}</span><p>{{ venue_name }}赛事管理程序</p>{% include 'site-credit.html' %}</footer><script src="/assets/history-ui.js"></script><script src="/assets/trend-data.js"></script><script src="/assets/public.js?v=20261012"></script><script src="/assets/viewer-design.js?v=20261012"></script></body></html>
