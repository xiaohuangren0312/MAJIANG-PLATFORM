<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>欢雀楼 · 选人活动</title><style>body{margin:0;background:#f5f1e9;color:#222;font:16px system-ui}header{background:#202021;color:white;padding:24px 5%;display:flex;gap:25px;align-items:center}header strong{font-size:25px}a{color:inherit}main{max-width:1100px;margin:auto;padding:30px 20px}button,input{font:inherit;padding:12px;border:1px solid #ccc;border-radius:6px}button{background:#c9272c;color:white;cursor:pointer}#list{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px;margin-top:25px}.card{display:block;background:white;padding:24px;border-radius:10px;text-decoration:none;border-top:4px solid #252525}.muted{color:#766f66}#error{color:#a51620;background:#ffe3e0;padding:15px;display:none}form{display:flex;gap:12px;flex-wrap:wrap}input{flex:1;min-width:180px}
header .account-identity{display:inline-flex;align-items:center;gap:8px;max-width:260px;min-width:0;text-decoration:none}header .account-identity>span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}header .account-identity>small{flex-shrink:0;font-size:11px;font-weight:500;padding:2px 6px;border:1px solid currentColor;border-radius:5px;color:inherit;opacity:.85}@media(max-width:850px){header .account-identity{max-width:100%;flex-wrap:wrap;justify-content:center;gap:3px 6px}header .account-identity>small{font-size:10px}}
</style></head><body><header><a href="/coach/profile/">队伍资料</a><a href="/coach/lineups/">出战名单</a><strong>雀 · 组队选人插件</strong><a href="/manage/">赛事管理</a><a href="/login/?next=/draft/">登录</a>{% include "account-identity.html" %}</header><main><h1>选人活动</h1><p class="muted">先创建活动，再手动关联赛事。每场活动有独立页面和选人记录。</p><p id="error" role="alert"></p><form id="create" hidden><input name="name" aria-label="活动名称" placeholder="例如：欢雀楼新赛季选人大会" maxlength="120" required><button>新建选人活动</button></form><div id="list">正在加载…</div></main><script>
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const error=e=>{document.getElementById('error').style.display='block';document.getElementById('error').textContent=e.message};
async function req(body){let r=await fetch('/api/draft/',body?{method:'POST',headers:{'Content-Type':'application/json','X-CSRFToken':document.cookie.split('; ').find(x=>x.startsWith('csrftoken='))?.split('=')[1]},body:JSON.stringify(body)}:{});let d=await r.json();if(!r.ok)throw Error(d.error||'请求失败');return d}
(async()=>{try{let d=await req();document.getElementById('create').hidden=!d.canCreate;document.getElementById('list').innerHTML=d.activities.length?d.activities.map(a=>`<a class="card" href="/draft/${a.id}/"><h2>${esc(a.name)}</h2><p>${esc(a.eventName||'尚未关联赛事')}</p><span class="muted">${({setup:'准备中',active:'进行中',complete:'已完成'})[a.status]}</span></a>`).join(''):(d.canCreate?'暂无选人活动，请先新建。':'暂无可访问的活动。私有活动请使用管理员或绑定教练账号登录。')}catch(e){error(e);document.getElementById('list').textContent='请登录后查看活动。'}})();
document.getElementById('create').onsubmit=async e=>{e.preventDefault();let b=e.target.querySelector('button');b.disabled=true;try{let d=await req({name:new FormData(e.target).get('name')});location.href='/draft/'+d.id+'/'}catch(e){error(e);b.disabled=false}};
</script></body></html>
