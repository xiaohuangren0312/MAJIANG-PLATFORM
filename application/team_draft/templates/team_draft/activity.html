</style></head><body><header><strong><span class="brand">雀<img src="/brand/logo" alt="欢雀楼" onerror="this.remove()" onload="this.previousSibling?.remove()"></span>欢雀楼 · 组队选人</strong><a href="/draft/">活动首页</a><a href="/manage/">赛事管理</a><a id="login" href="/login/">登录 / 切换账号</a><span class="connection" id="connection" role="status">正在同步…</span><button id="more" hidden>更多</button></header><main><div id="error" role="alert"></div><div id="chooser"><strong id="linked"></strong><button id="link-toggle" hidden>关联赛事</button></div><section id="link-panel" hidden><label>手动选择关联赛事<select id="event"><option value="">请选择赛事</option></select></label><p>开始前可更换关联，更换后清空选人配置；不会移动任何已入队选手。</p><button id="link-save">确认关联</button></section><section><h1 id="name"></h1><div id="phase" class="phase"></div><p id="progress" class="muted"></p></section><section id="more-panel" hidden></section><section id="preview-panel" hidden></section><section id="setup" hidden></section><section id="auction" hidden></section><section id="pick" hidden></section><section class="cards" id="teams"></section><section id="feed"></section></main><div id="confirm-dialog" role="dialog" aria-modal="true" aria-label="操作确认" hidden style="position:fixed;inset:0;background:#0009;z-index:20;display:none;align-items:center;justify-content:center;padding:20px"><div style="background:#fffaf0;padding:24px;border-radius:10px;max-width:540px"><p id="confirm-message" style="line-height:1.7"></p><button id="confirm-yes" class="primary">确认</button> <button id="confirm-no">取消</button></div></div><footer id="bar" class="bar"></footer><script>
const $=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let state,id="{{ activity_id|escapejs }}",busy=false,timer;
const csrf=()=>document.cookie.split('; ').find(x=>x.startsWith('csrftoken='))?.split('=')[1];
function error(e){$('error').textContent=e.message||e;$('error').style.display='block'}
async function request(url,body){let r=await fetch(url,body?{method:'POST',headers:{'Content-Type':'application/json','X-CSRFToken':csrf()},body:JSON.stringify(body)}:{});let d;try{d=await r.json()}catch(e){throw Error('连接异常，请稍后重试')}if(!r.ok){const e=Error(d.error||'请求失败，请重新登录或刷新');e.status=r.status;throw e}return d}
async function load(force=false){if(!id||busy)return;try{let next=await request('/api/draft/'+id+'/');$('connection').textContent='已同步 · '+new Date().toLocaleTimeString();if(force||!state||next.revision!==state.revision||next.manager!==state.manager||next.myTeam!==state.myTeam||next.public!==state.public||JSON.stringify(next.history)!==JSON.stringify(state.history)||JSON.stringify(next.players)!==JSON.stringify(state.players)||JSON.stringify(next.teams)!==JSON.stringify(state.teams)){if(!force&&state&&configOpen&&state.status==='setup'&&next.manager===state.manager&&next.myTeam===state.myTeam){error('活动已更新，请先刷新配置再保存');$('connection').textContent='有新版本 · 保存前请刷新';return}state=next;render()}}catch(e){if(e.status===401||e.status===403){state=null;['teams','auction','pick','setup','feed','bar','more-panel','preview-panel'].forEach(id=>{$(id).innerHTML='';$(id).hidden=true});$('more').hidden=true;$('link-panel').hidden=true;$('link-toggle').hidden=true;$('name').textContent='此活动需要访问授权';$('phase').textContent='请登录管理员或绑定教练账号';$('progress').textContent='';$('linked').textContent=''}$('connection').textContent='连接中断 · 正在重试（不会自动 PASS）';error(e)}}
async function send(action,data={}){if(busy)return;busy=true;document.querySelectorAll('button').forEach(x=>x.disabled=true);try{state=await request('/api/draft/'+id+'/',{action,revision:state.revision,...data});$('error').style.display='none';render()}catch(e){error(e);busy=false;await load(true)}finally{busy=false;['more','link-toggle','link-save'].forEach(id=>$(id).disabled=false)}}
const player=pid=>state.players.find(p=>p.id===pid)?.name||'未知';const team=tid=>state.teams.find(t=>t.id===tid)?.name||'未知';
function options(rows,chosen){return '<option value="">请选择</option>'+rows.map(p=>`<option value="${esc(p.id)}" ${p.id===chosen?'selected':''}>${esc(p.name)}</option>`).join('')}
function render(){const d=state.draft,phase=d?.phase||'setup';$('name').textContent=state.name;$('linked').textContent=state.eventName?(state.eventId?'关联赛事：':'原关联赛事（已解除）：')+state.eventName:'尚未关联赛事';$('link-toggle').hidden=!state.manager||state.status!=='setup';$('link-toggle').textContent=state.eventId?'更换关联赛事':'关联赛事';$('phase').textContent=({setup:'准备选人',nomination:'一选 · 教练提交',revealed:'一选 · 已公布','auction-ready':'竞拍选人 · 待抽取',auction:'竞拍选人','third-ready':'第三轮 · 补选分派','review-ready':'选人已处理完毕 · 待收尾'})[phase]||phase;$('setup').hidden=phase!=='setup'||!state.manager;$('pick').hidden=true;$('auction').hidden=true;$('teams').innerHTML='';$('feed').innerHTML='';$('progress').textContent='';$('bar').innerHTML='<strong>'+ (state.manager?'主持操作':state.myTeam?'教练终端':'观众 · 只读')+'</strong>';
if(!state.eventId&&state.status!=='complete'){$('setup').hidden=true;$('progress').textContent='请先手动关联赛事，再配置队伍和候选选手。';return}
if(phase==='setup'&&state.manager){setup();$('bar').insertAdjacentHTML('beforeend','<button class="primary" id="save">保存配置</button>'+(d?'<button id="start">开始一选</button>':''));$('save').onclick=save;if(d)$('start').onclick=async()=>{if(await askConfirm('按已保存配置开始一选？教练将进入队伍名单。'))send('start')};}
if(!d)return;
$('teams').innerHTML=d.teams.map(t=>{let members=state.players.filter(p=>p.teamId===t.teamId&&!p.bond&&p.id!==t.coachPlayerId);return `<article class="card"><h3>${esc(team(t.teamId))}</h3><div>教练：${esc(player(t.coachPlayerId))}</div><p>余额 <b>${t.balance}</b> · ${members.length+1}/${t.capacity} 人${phase==='setup'?'（配置人数）':''}</p><div class="badge">${state.status==='complete'?'最终阵容':d.lot?(d.lot.leader===t.teamId?'领先 '+d.lot.price:d.lot.passed.includes(t.teamId)?'本选手 PASS':d.lot.excluded[t.teamId]|| (d.lot.turn===t.teamId?'当前响应':'等待')):(phase==='setup'?'未开始':d.submitted?.includes(t.teamId)?'已提交':d.pending?.includes(t.teamId)?'等待提交':'已完成一选')}</div><div class="members">${members.map(p=>'<span>'+esc(p.name)+'</span>').join('')}${Array.from({length:Math.max(0,t.capacity-1-members.length)},()=>'<span class="muted">待选</span>').join('')}</div></article>`}).join('');
if(phase==='nomination'){$('progress').textContent=`第 ${d.round} 次选择 · 已提交 ${d.submitted.length}/${d.pending.length} 队（公布前隐藏选择）`;if(state.myTeam&&d.pending.includes(state.myTeam)){$('pick').hidden=false;$('pick').innerHTML=d.myPick?'<strong>已提交：'+esc(player(d.myPick))+'</strong><p>等待管理员公布。</p>':'<strong>免费指定一名选手</strong><select id="candidate">'+options(d.candidates.filter(c=>c.state==='available').map(c=>({id:c.playerId,name:player(c.playerId)})))+'</select><button class="primary" id="submit">提交首选</button>';if($('submit'))$('submit').onclick=()=>{if($('candidate').value)send('nominate',{playerId:$('candidate').value})}}if(state.manager){$('bar').insertAdjacentHTML('beforeend','<button class="primary" id="reveal">公布选择</button>');$('reveal').disabled=d.submitted.length!==d.pending.length;$('reveal').onclick=()=>send('reveal')}}
if(phase==='revealed'&&state.manager){$('bar').insertAdjacentHTML('beforeend','<button id="continue" class="primary">'+(d.allocations.length===d.teams.length?'完成一选':'开启补选')+'</button>');$('continue').disabled=d.conflicts.length>0;$('continue').onclick=()=>send('continue')}
if(phase==='auction-ready'){$('progress').textContent='随机抽取下一名选手，确认展示资料后开始竞拍。';if(state.manager){$('bar').insertAdjacentHTML('beforeend','<button class="primary" id="draw">随机抽取选手</button>');$('draw').onclick=()=>send('draw')}}
if(phase==='third-ready'){let n=d.candidates.filter(c=>c.state==='third-pool').length;$('progress').textContent=n?'待补选 '+n+' 人 · 重新竞拍后由管理员分派，第二轮 PASS 已重置。':'没有待补选选手，名单已保存。';if(state.manager&&n){$('bar').insertAdjacentHTML('beforeend','<button class="primary" id="draw-third">抽取第三轮选手</button>');$('draw-third').onclick=()=>send('draw-third')}}
if(phase==='review-ready')$('progress').textContent='第三轮分派完成，名单与预算已保存。请检查最终名单和余额，再确认结束活动。';
if(phase==='auction')renderAuction();
$('feed').innerHTML=(d.reveals||[]).map(r=>'<h3>第 '+r.round+' 次公布</h3>'+Object.entries(r.choices).map(([tid,pid])=>esc(team(tid))+' → '+esc(player(pid))).join('<br>')).join('')+(d.rolls||[]).map(r=>'<p>Roll · '+esc(player(r.playerId))+'：'+Object.entries(r.values).map(([tid,v])=>esc(team(tid))+' '+v).join(' / ')+' · '+(r.winner?'获得：'+esc(team(r.winner)):'最高点相同，需重掷')+'</p>').join('')+(d.conflicts||[]).map(c=>'<p>冲突：'+esc(player(c.playerId))+' · '+c.teams.map(team).map(esc).join(' / ')+(state.manager?' <button data-roll="'+esc(c.playerId)+'">Roll 决定归属</button>':'')+'</p>').join('');document.querySelectorAll('[data-roll]').forEach(b=>b.onclick=()=>send('roll',{playerId:b.dataset.roll}));}
function renderAuction(){const d=state.draft,l=d.lot,c=d.candidates.find(c=>c.playerId===l.playerId);$('auction').hidden=false;$('auction').style.cssText='background:#202021;color:#fff;border-radius:12px;padding:24px';$('auction').innerHTML=`<div style="display:flex;gap:30px;flex-wrap:wrap"><div style="flex:1;min-width:220px"><div class="muted" style="color:#ccc">${l.stage===3?'第三轮补选':'当前竞拍选手'}</div><h2 style="font-size:36px;margin:10px 0">${esc(player(l.playerId))}</h2><p>起拍价 ${l.startPrice} 点</p><p style="white-space:pre-wrap">${esc(c.description||'暂无介绍')}</p></div><div><div>当前最高报价</div><strong style="font-size:60px">${l.price??'—'}</strong><p>${l.leader?esc(team(l.leader)):'尚无出价'}</p><div>${({preview:'等待主持开始',bidding:'轮到 '+team(l.turn), 'awaiting-confirm':l.stage===3?'等待管理员分派':l.leader?'等待确认成交':'无人有效出价，等待确认流拍',settled:l.outcome==='assigned'?'已分派至 '+team(l.assignedTeam):l.outcome==='sold'?'已成交':'已进入第三轮池'})[l.state]}</div></div></div>`;
const act=(action,data={})=>send(action,{lotId:l.id,...data});
if(state.manager){if(l.state==='preview'){$('bar').insertAdjacentHTML('beforeend','<button class="primary" id="open-bidding">开始竞拍</button>');$('open-bidding').onclick=()=>act('open-bidding')}
if(l.state==='awaiting-confirm'&&l.stage!==3){$('bar').insertAdjacentHTML('beforeend','<span>'+ (l.leader?esc(player(l.playerId))+' → '+esc(team(l.leader))+' · 成交后余额 '+(d.teams.find(t=>t.teamId===l.leader).balance-l.price):'本选手进入第三轮池')+'</span><button class="primary" id="confirm-lot">'+(l.leader?'确认成交 · '+l.price+'点':'确认流拍')+'</button>');$('confirm-lot').onclick=()=>act('confirm-lot')}
if(l.state==='awaiting-confirm'&&l.stage===3){$('bar').insertAdjacentHTML('beforeend','<label>接收队伍<select id="assign-team">'+options(d.teams.map(t=>({id:t.teamId,name:team(t.teamId)})),l.leader)+'</select></label><label>扣费点数<input id="assign-price" type="number" min="0" value="'+(l.leader?l.price:0)+'" '+(l.leader?'readonly':'')+'></label><span id="assign-preview"></span><button class="primary" id="assign-third">确认分派</button>');const preview=()=>{let t=d.teams.find(t=>t.teamId===$('assign-team').value),price=Number($('assign-price').value);let count=t?state.players.filter(p=>p.teamId===t.teamId&&!p.bond).length:0;let valid=t&&Number.isInteger(price)&&price>=0&&price<=t.balance&&count<t.capacity;$('assign-preview').textContent=t?player(l.playerId)+' → '+team(t.teamId)+' · 入队后 '+(count+1)+'/'+t.capacity+' 人 · 余额 '+(t.balance-price)+(valid?'':'（人数或价格无效）'):'请选择接收队伍';$('assign-third').disabled=!valid};$('assign-team').onchange=preview;$('assign-price').oninput=preview;preview();$('assign-third').onclick=()=>act('assign-third',{teamId:$('assign-team').value,price:Number($('assign-price').value)})}
if(l.state==='settled'){$('bar').insertAdjacentHTML('beforeend','<button class="primary" id="next-lot">下一位</button>');$('next-lot').onclick=()=>act('next-lot')}}
if(state.myTeam){$('pick').hidden=false;if(l.state==='bidding'&&l.turn===state.myTeam){let own=d.teams.find(t=>t.teamId===state.myTeam);$('pick').innerHTML=`<strong>轮到你出价 · 余额 ${own.balance}</strong><p>最低出价 ${l.minimum} 点；PASS 后，本阶段不能再对该选手出价。</p><input aria-label="出价" id="bid-price" type="number" min="${l.minimum}" max="${own.balance}" step="1" value="${l.minimum}"><button id="bid" class="primary">出价</button> <button id="pass">PASS</button>`;$('bid').onclick=()=>act('bid',{price:Number($('bid-price').value)});$('pass').onclick=()=>act('pass')}
else $('pick').textContent=l.passed.includes(state.myTeam)?'你已对本选手 PASS，请等待下一名选手。':l.excluded[state.myTeam]||'请等待当前队伍响应或主持推进。';}}
function setup(){const d=state.draft;$('setup').innerHTML='<h2>队伍与教练</h2><p class="muted">教练账号先在赛事管理中创建；这里只填写账号名，不授予赛事管理权限。教练本人需要先录入选手名单。</p><div class="config">'+state.teams.filter(t=>t.active).map(t=>{let r=d?.teams.find(x=>x.teamId===t.id);return `<div class="team-input" data-team="${esc(t.id)}"><label><span><input type="checkbox" class="include" ${r?'checked':''}> ${esc(t.name)}</span><span>教练选手</span><select class="coach">${options(state.players.filter(p=>p.active&&!p.bond&&(!p.teamId||p.teamId===t.id)),r?.coachPlayerId)}</select></label><label>教练账号<input class="username" value="${esc(r?.coachUsername||'')}" autocomplete="off"></label><label>总预算<input class="budget" type="number" min="0" value="${r?.budget??30}"></label><label>教练定价<input class="price" type="number" min="0" value="${r?.coachPrice??0}"></label><label>人数上限（含教练）<input class="capacity" type="number" min="2" value="${r?.capacity??7}"></label></div>`}).join('')+'</div><h2>候选池</h2><p class="muted">勾选参拍选手，教练本人不应勾入候选池。列表为空时，请先到赛事管理录入未分队的选手。</p>'+state.players.filter(p=>p.active&&!p.teamId&&!p.bond).map(p=>{let c=d?.candidates.find(x=>x.playerId===p.id);return `<div class="candidate" data-player="${esc(p.id)}"><label><span><input class="include" type="checkbox" ${c?'checked':''}> ${esc(p.name)}</span></label><label>起拍价<input class="start-price" type="number" min="0" value="${c?.startPrice??0}"></label><label>选手介绍<textarea class="description" maxlength="2000">${esc(c?.description||'')}</textarea></label></div>`}).join('')+`<p><label>最小加价步长<input id="step" type="number" min="1" value="${d?.bidStep??1}"></label></p>`}
function save(){const teams=[...document.querySelectorAll('[data-team]')].filter(x=>x.querySelector('.include').checked).map(x=>({teamId:x.dataset.team,coachPlayerId:x.querySelector('.coach').value,coachUsername:x.querySelector('.username').value.trim(),budget:Number(x.querySelector('.budget').value),coachPrice:Number(x.querySelector('.price').value),capacity:Number(x.querySelector('.capacity').value)}));const candidates=[...document.querySelectorAll('[data-player]')].filter(x=>x.querySelector('.include').checked).map(x=>({playerId:x.dataset.player,startPrice:Number(x.querySelector('.start-price').value),description:x.querySelector('.description').value,historyLinks:[...x.querySelectorAll('[data-history-event]')].filter(e=>e.value).map(e=>({eventId:e.dataset.historyEvent,playerId:e.value}))}));send('configure',{teams,candidates,bidStep:Number($('step').value)})}
$('link-toggle').onclick=async()=>{try{let data=await request('/api/draft/');$('event').innerHTML=options(data.events,state.eventId);$('link-panel').hidden=!$('link-panel').hidden}catch(e){error(e)}};
$('link-save').onclick=async()=>{if(!$('event').value)return;if(state.draft&&state.eventId!==$('event').value&&!await askConfirm('更换关联赛事将清空当前选人配置，是否继续？'))return;await send('link',{eventId:$('event').value});$('link-panel').hidden=true};

function askConfirm(message){return new Promise(resolve=>{const dialog=$('confirm-dialog');$('confirm-yes').disabled=false;$('confirm-no').disabled=false;$('confirm-message').textContent=message;dialog.hidden=false;dialog.style.display='flex';const close=value=>{dialog.hidden=true;dialog.style.display='none';resolve(value)};$('confirm-yes').onclick=()=>close(true);$('confirm-no').onclick=()=>close(false);$('confirm-yes').focus()})}
let configOpen=false,historySelected={};
$('login').href='/login/?next='+encodeURIComponent(location.pathname);
const oldSetup=setup;
setup=function(){oldSetup();document.querySelectorAll('[data-player]').forEach(row=>{const links=state.draft?.historyLinks?.[row.dataset.player]||[];const box=document.createElement('details');box.className='history-config';box.innerHTML='<summary>历史身份关联（明确选择，不按同名匹配）</summary><p class="muted">仅展示已公开赛事。选定的是同一人的历史身份；没有确认时请留空。</p>'+(state.historyOptions||[]).map(e=>'<label>'+esc(e.name)+'<select data-history-event="'+esc(e.id)+'">'+options(e.players,links.find(l=>l.eventId===e.id)?.playerId)+'</select></label>').join('');row.appendChild(box)})};
function logo(tid){const t=state.teams.find(t=>t.id===tid);const url=t?.logo;return '<span class="team-logo">'+(url&&url.startsWith('/media/')?'<img src="'+esc(url)+'" alt="">':'雀')+'</span>'}
function renderHistory(pid){const rows=state.history?.[pid]||[];if(!rows.length)return '<h3>历史成绩</h3><p class="muted">暂无历史成绩</p>';const chosen=rows.find(r=>r.eventId===historySelected[pid])||rows[0];const fmt=v=>v==null?'未知':Number(v).toFixed(2).replace(/\.00$/,'');return '<label>历史赛事<select id="history-select">'+rows.map(r=>'<option value="'+esc(r.eventId)+'" '+(r===chosen?'selected':'')+'>'+esc(r.name)+'</option>').join('')+'</select></label><div class="history-wrap"><table><thead><tr><th>阶段</th><th>场数</th><th>总 PT</th><th>场均 PT</th><th>平均顺位</th></tr></thead><tbody>'+chosen.stages.map(r=>'<tr><td>'+esc(r.name)+'</td><td>'+fmt(r.games)+'</td><td>'+fmt(r.total)+'</td><td>'+fmt(r.average)+'</td><td>'+fmt(r.avgRank)+'</td></tr>').join('')+'</tbody></table></div><p class="muted">按明确选手身份关联；缺失指标保留未知，不含阶段带入。</p>'}
const oldRenderAuction=renderAuction;
renderAuction=function(){oldRenderAuction();const d=state.draft,l=d.lot,c=d.candidates.find(c=>c.playerId===l.playerId);$('auction').innerHTML='<div class="hero"><div><span>'+(l.stage===3?'第三轮 · 补选分派':'当前竞拍选手')+'</span><h2>'+esc(player(l.playerId))+'</h2><p>起拍价 <b>'+l.startPrice+'</b> 预算点</p><div class="description">'+esc(c.description||'暂无介绍')+'</div></div><div id="history">'+renderHistory(l.playerId)+'</div><div><span>当前最高报价</span><strong class="quotation">'+(l.price??'—')+'</strong><p>'+ (l.leader?esc(team(l.leader)):'尚无出价')+'</p><strong>'+esc(({preview:'等待主持开始',bidding:'轮到 '+team(l.turn),'awaiting-confirm':l.stage===3?'等待管理员分派':l.leader?'等待确认成交':'无人有效出价，等待确认流拍',settled:l.outcome==='assigned'?'已分派至 '+team(l.assignedTeam):l.outcome==='sold'?'已成交':'已进入第三轮池'})[l.state])+'</strong></div></div>';if($('history-select'))$('history-select').onchange=e=>{historySelected[l.playerId]=e.target.value;render()};};
const oldRender=render;
render=function(){['teams','bar','feed'].forEach(id=>$(id).hidden=false);oldRender();document.body.classList.toggle('coach-view',!!state.myTeam&&!state.manager);if(state.myTeam&&!state.manager)$('auction').before($('pick'));else $('auction').after($('pick'));$('more').hidden=!state.manager;$('setup').hidden=!configOpen||state.status!=='setup'||!state.manager;$('more-panel').innerHTML=state.manager?'<b>'+ (state.public?'已公开 · 任何人可只读访问':'私有 · 仅管理员和绑定教练可访问')+'</b><p><button id="visibility">'+(state.public?'关闭公开访问':'公开给观众')+'</button>'+(state.status==='setup'?'<button id="configure-toggle">'+(configOpen?'收起配置':'编辑配置')+'</button><button id="refresh-config">刷新配置</button>':'')+(state.status!=='complete'?'<button id="undo-control">撤销上一步 · 先预览</button>':'')+((state.status==='setup'||state.status==='complete')&&state.eventId?'<button id="unlink-control">解除赛事关联</button>':'')+'</p>':'';if($('visibility'))$('visibility').onclick=async()=>{if(!state.public&&!await askConfirm('公开后，任何持有活动链接的人可查看名单和已公布选人信息。确认公开？'))return;send('publish',{public:!state.public})};if($('configure-toggle'))$('configure-toggle').onclick=()=>{configOpen=!configOpen;render()};if($('refresh-config'))$('refresh-config').onclick=async()=>{if(await askConfirm('刷新会放弃尚未保存的配置输入，继续？'))load(true)};if($('undo-control'))$('undo-control').onclick=()=>controlPreview('undo');if($('unlink-control'))$('unlink-control').onclick=async()=>{if(await askConfirm(state.status==='setup'?'解除关联会清空当前配置，审计保留。继续？':'解除关联保留最终阵容和审计，并允许在赛事管理中清理符合条件的测试赛事。继续？'))send('unlink')};
if(state.status==='setup'&&state.manager&&!configOpen){$('bar').querySelector('#save')?.remove();$('bar').insertAdjacentHTML('beforeend','<button id="open-config">编辑配置</button>');$('open-config').onclick=()=>{configOpen=true;render()}}
const d=state.draft;if(d){document.querySelectorAll('#teams .card').forEach((card,i)=>{const t=d.teams[i];const h=card.querySelector('h3');h.innerHTML=logo(t.teamId)+'<span>'+esc(team(t.teamId))+'</span>';card.querySelector('h3+div')?.classList.add('coach');card.classList.toggle('leading',d.lot?.leader===t.teamId);card.classList.toggle('responding',d.lot?.turn===t.teamId);if(d.lot?.leader===t.teamId&&d.lot.state==='awaiting-confirm'){const preview=document.createElement('p');preview.className='badge';preview.textContent='成交后余额 '+(t.balance-d.lot.price);card.appendChild(preview)}});
if(state.manager&&state.status==='active'&&(['auction-ready','third-ready','review-ready'].includes(d.phase)||(d.phase==='auction'&&(['settled','preview','awaiting-confirm'].includes(d.lot?.state))))){$('bar').insertAdjacentHTML('beforeend','<button id="finish-control">最终检查 / 结束</button>');$('finish-control').onclick=()=>controlPreview('finish')}
if(state.status==='complete'){$('phase').textContent='选人活动已结束';$('progress').textContent='最终阵容与预算只读保存；赛事仍可继续安排比赛。';$('bar').innerHTML='<strong>活动已结束 · 最终阵容</strong>';if(d.completion?.unassigned?.length)$('progress').textContent+=' 未分队：'+d.completion.unassigned.map(p=>p.name).join('、')}}
};
async function controlPreview(operation){try{const r=await request('/api/draft/'+id+'/',{action:'preview',operation,revision:state.revision}),p=r.preview;const box=$('preview-panel');box.hidden=false;box.innerHTML='<h2>'+(operation==='finish'?'最终检查':'撤销影响预览')+'</h2><p>'+esc(p.message)+'</p>'+(p.teams?'<ul>'+p.teams.map(t=>'<li>'+esc(t.name)+' · '+t.count+'/'+t.capacity+'人 · 余额 '+t.balance+'<br>'+t.members.map(esc).join('、')+'</li>').join('')+'</ul>':'')+(p.rosterChanges?'<p>将恢复到：'+esc(({setup:'准备',nomination:'一选提交',revealed:'一选公布',auction:'竞拍','auction-ready':'待抽取','third-ready':'第三轮待抽取','review-ready':'最终检查'})[p.phase]||'上一步')+' · 撤销 '+esc(({configure:'保存配置',start:'开始一选',nominate:'提交首选',reveal:'公布选择',roll:'冲突Roll',continue:'推进一选',draw:'抽取选手','draw-third':'抽取第三轮选手','open-bidding':'开始竞拍',bid:'报价',pass:'PASS','confirm-lot':'确认成交或流拍','assign-third':'确认分派','next-lot':'下一位'})[p.action]||'上一步操作')+'</p><ul>'+p.rosterChanges.map(r=>'<li>'+esc(r.player)+'：'+esc(r.fromTeam?team(r.fromTeam):'未分队')+' → '+esc(r.toTeam?team(r.toTeam):'未分队')+'</li>').join('')+'</ul><p>恢复余额：'+p.balances.map(t=>esc(team(t.teamId))+' '+t.balance).join(' / ')+'</p>':'')+(p.unassigned?.length?'<p>保持未分队：'+p.unassigned.map(x=>esc(x.name)).join('、')+'</p>':'')+'<button id="confirm-control" class="primary">确认'+(operation==='finish'?'结束活动':'撤销')+'</button> <button id="cancel-control">取消</button>';$('cancel-control').onclick=()=>box.hidden=true;$('confirm-control').onclick=async()=>{box.hidden=true;await send(operation,{previewToken:p.token})};box.scrollIntoView({behavior:'smooth',block:'center'})}catch(e){error(e)}}
$('more').onclick=()=>{$('more-panel').hidden=!$('more-panel').hidden};
window.addEventListener('online',()=>load(true));
window.addEventListener('offline',()=>{$('connection').textContent='连接中断 · 恢复后自动同步（不会自动 PASS）'});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)load()});
(async()=>{await load(true);timer=setInterval(()=>load(),2000)})();

</script></body></html>
