<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>团体赛批量排程 · {{ event.name }}</title><link rel="stylesheet" href="/assets/batch-schedule.css"></head>
<body><header><strong>{{ venue_name }}　/　赛事管理</strong><a href="/manage/">返回赛事管理</a></header>
<main><h1>团体赛批量排程</h1><div class="context">{{ event.name }}　<label>阶段 <select id="stage"></select></label></div>
<section class="setup"><div><h2>比赛日</h2><div id="days" class="chips"></div><div class="line"><input type="date" id="day" aria-label="比赛日"><button id="add">添加日期</button></div></div>
<div><h2>每日安排</h2><div class="line"><label>首场 <input id="start" type="time" value="19:30"></label><label>时段数 <input id="rounds" type="number" min="1" max="48" value="2"></label></div><div class="line"><label>间隔 <input id="interval" type="number" min="1" max="1440" value="60"> 分钟</label></div><div class="chips" id="tables" aria-label="用桌"></div></div>
<div><h2>生成时优先满足</h2><label class="goal"><input type="checkbox" id="appear" checked>每队出战次数相同</label><label class="goal"><input type="checkbox" id="pair" checked>任意两队同桌次数相同</label><label class="goal"><input type="checkbox" id="spread" checked>每队在各桌次数相同</label><button id="generate" class="primary">生成预览</button></div></section>
<p id="message" role="status" aria-live="polite"></p><div class="layout"><section><div class="heading"><h2>排程草稿</h2><span id="total"></span></div><div id="filters" class="chips"></div><div class="scroll"><table><thead><tr><th>比赛日</th><th>开赛</th><th>桌次</th><th>队伍一</th><th>队伍二</th><th>队伍三</th><th>队伍四</th></tr></thead><tbody id="rows"></tbody></table></div><div class="footer"><span id="status" role="status"></span><button id="save" class="primary" disabled>保存整批赛程</button></div></section>
<section><h2>阶段次数校验</h2><div id="metrics"></div><p id="warning" hidden></p><div class="stats scroll"><table id="detail"></table></div></section></div></main>
{{ config|json_script:"batch-config" }}{% csrf_token %}<script src="/assets/batch-schedule.js"></script></body></html>
