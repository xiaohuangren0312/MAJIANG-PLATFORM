/* Responsive team cards: readable names and consistent roster slots. */
#teams.cards{grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;align-items:stretch}
#teams .card{padding:20px;background:#fffefa;border:1px solid #dfd8cb;border-top:3px solid #b89962;border-radius:12px;box-shadow:0 2px 5px #30241405}
#teams .card h3{font-size:18px;gap:10px;margin:0 0 16px;min-height:38px}
#teams .team-logo{width:34px;height:34px;font-size:18px;border-radius:8px;background:#f0ebe2}
#teams .team-metrics{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-top:1px solid #eee7dc;border-bottom:1px solid #eee7dc;gap:12px}
#teams .team-budget,#teams .team-count{display:flex;flex-direction:column;gap:4px}
#teams .team-count{text-align:right}
#teams .team-metrics small{font-size:12px;color:#847b6c;font-weight:400}
#teams .team-budget>strong{font-size:26px;color:#a52d2d;line-height:1.15;font-weight:650}
#teams .team-count>strong{font-size:20px;font-weight:600;color:#343029}
#teams .badge{font-size:12px;color:#7c7262;font-weight:500;margin:12px 0 0}
#teams .members{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
#teams .members>span{height:58px;min-height:58px;padding:7px 5px;border:1px solid #e9e3d9;border-radius:8px;background:#f7f4ee;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
#teams .members>span.muted{color:#aaa191;background:transparent;border:1px dashed #ded6c8;font-size:12px}
#teams .members>span.playing-coach{border:1px solid #b58a3e;background:#fbf3df;color:#71541f}
#teams .playing-coach strong{font-size:13px;font-weight:600;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#teams .playing-coach small{font-size:10px;line-height:1.1;color:#98752f}
#teams .coach{border:0;padding:0;margin:-6px 0 12px;color:#82745d;font-size:12px}
#teams .card.leading{border-color:#bf4545;box-shadow:0 0 0 1px #bf4545}
#teams .card.responding{box-shadow:0 0 0 2px #bd9a5d}
@media(min-width:1450px){#teams.cards{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:1000px){#teams.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:580px){#teams.cards{grid-template-columns:1fr}#teams .card{padding:16px}#teams .members>span{height:54px;min-height:54px}}

/* Configuration form layout: bounded fields, shared control sizes. */
#setup{background:#eee8dd;padding:22px;border-radius:12px;min-width:0}
#setup h2{font-size:21px;margin:4px 0 10px}
#setup>.muted{margin:0 0 18px;line-height:1.6}
#setup .config{gap:12px;margin-bottom:18px}
#setup .team-input{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 18px;padding:18px;background:#fffefa;border:1px solid #e3dccf;border-radius:10px}
#setup .team-input .team-config-title{grid-column:1/-1;display:flex;align-items:center;gap:9px;margin:0;padding-bottom:12px;border-bottom:1px solid #eee7dc;font-size:15px;color:#332c21}
#setup label{min-width:0;gap:7px;font-size:12px;color:#766b5a;align-content:start}
#setup input:not([type=checkbox]),#setup select,#setup textarea{width:100%;min-width:0;max-width:100%;margin:0;border:1px solid #d9d1c4;background:#fff;border-radius:6px;color:#29251f;font-size:14px;box-sizing:border-box;box-shadow:none}
#setup input:not([type=checkbox]),#setup select{height:40px;padding:8px 10px}
#setup input[type=checkbox]{width:16px;height:16px;min-width:16px;margin:0;accent-color:#ae3434;vertical-align:middle}
#setup input[readonly]{background:#f1eee8;color:#8b8173}
#setup input:focus,#setup select:focus,#setup textarea:focus{outline:2px solid #b89a6255;outline-offset:1px;border-color:#b89a62}
#setup .candidate{display:grid;grid-template-columns:minmax(125px,1fr) 100px minmax(0,2fr);gap:12px 18px;align-items:start;margin:10px 0;padding:16px 18px;border:1px solid #e3dccf;border-radius:10px;background:#fffefa;min-width:0}
#setup .candidate>label:first-child{align-self:center;font-size:14px;color:#332c21}
#setup .candidate>label:first-child>span{display:flex;align-items:center;gap:9px;overflow-wrap:anywhere}
#setup .candidate textarea{height:64px;min-height:64px;padding:9px 10px;resize:vertical;line-height:1.5}
#setup .history-config{grid-column:1/-1;border-top:1px solid #eee7dc;margin:0;padding-top:10px;min-width:0}
#setup .history-config summary{font-size:12px;color:#88734d;cursor:pointer;padding:2px 0}
#setup .history-config label{display:inline-grid;width:calc(50% - 12px);min-width:0;margin:8px 12px 0 0;vertical-align:top}
#setup .history-config p{font-size:12px;margin:10px 0;line-height:1.5}
#capacity-summary{padding:12px 14px;background:#e7dfd0;border-radius:7px;font-size:13px;margin:16px 0 24px;color:#69583b}
#setup>p:last-child label{max-width:160px}
@media(max-width:650px){#setup{padding:14px}#setup .team-input{grid-template-columns:repeat(2,minmax(0,1fr));padding:14px;gap:12px}#setup .candidate{grid-template-columns:minmax(0,1fr) 100px;padding:14px;gap:12px}#setup .candidate>label:nth-child(3){grid-column:1/-1}#setup .history-config label{display:grid;width:100%;margin-right:0}}


#setup .candidate-tools{background:#fffefa;border:1px solid #ded6c8;border-radius:9px;padding:14px;margin:14px 0 10px}
#setup .candidate-filter,#setup .candidate-batch{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
#setup .candidate-filter input{flex:1;min-width:150px;max-width:340px}#setup .candidate-filter select{width:125px}#candidate-count{font-size:12px;color:#817560}

#setup .candidate-extra{min-width:0}#setup .candidate-extra>summary{font-size:12px;color:#8a6d37;cursor:pointer;padding:7px 0}
#setup .candidate-extra[open]{grid-column:1/-1;border-top:1px solid #eee7dc;padding-top:6px}#setup .candidate-extra-body{padding:8px 0;display:grid;grid-template-columns:1fr;gap:10px}#setup .candidate-extra-body textarea{min-height:65px}
@media(max-width:650px){#setup .candidate{grid-template-columns:minmax(90px,1fr) 100px;gap:8px}#setup .candidate-extra{grid-column:1/-1}#setup .candidate-extra:not([open]){border:0}#setup .candidate-batch{gap:7px}}

setup=function(){oldSetup();document.querySelectorAll('[data-team]').forEach(row=>{const playing=row.querySelector('.playing'),price=row.querySelector('.price');const sync=()=>{price.readOnly=playing.value==='false';if(price.readOnly)price.value='0';updateCapacitySummary()};playing.addEventListener('change',sync);sync()});$('setup').oninput=updateCapacitySummary;$('setup').onchange=updateCapacitySummary;updateCapacitySummary();document.querySelectorAll('[data-player]').forEach(row=>{const links=state.draft?.historyLinks?.[row.dataset.player]||[];const box=document.createElement('details');box.className='history-config';box.innerHTML='<summary>关联历史成绩</summary><p class="muted">仅展示已公开赛事。选定的是同一人的历史身份；没有确认时请留空。</p>'+(state.historyOptions||[]).map(e=>'<label>'+esc(e.name)+'<select data-history-event="'+esc(e.id)+'">'+options(e.players,links.find(l=>l.eventId===e.id)?.playerId)+'</select></label>').join('');row.querySelector('.candidate-extra-body').appendChild(box)});initCandidateTools()};
const defaultTeamIcons=[["山岚", "<path opacity=\".28\" d=\"M3 30L16 7l9 15 7-9 6 17Z\"/><path d=\"M6 31L18 11l-4 15 7-7 9 12Z\"/><path opacity=\".5\" d=\"M25 31l5-13 7 13Z\"/>"], ["流泉", "<path opacity=\".28\" d=\"M3 23C9 10 20 7 34 13 20 8 14 19 3 23Z\"/><path d=\"M3 28C14 31 16 9 36 17 21 14 23 36 3 28Z\"/><path opacity=\".5\" d=\"M10 34C22 37 26 22 38 25 27 22 27 39 10 34Z\"/>"], ["竹影", "<path d=\"M17 36l2-30 2-2-1 14-2 18Z\"/><path opacity=\".45\" d=\"M25 36l1-24 2-3-1 27Z\"/><path d=\"M19 17C10 17 7 12 6 7c8 1 12 5 13 10ZM20 23c1-8 7-11 13-12-1 7-7 11-13 12Z\"/><path opacity=\".55\" d=\"M26 28c3-6 7-8 12-8-3 6-7 8-12 8Z\"/>"], ["苍松", "<path d=\"M20 36l-2-15 2-10 2 14 7 11Z\"/><path opacity=\".4\" d=\"M4 21c5-7 12-9 19-4l-3 5ZM17 11c6-7 15-6 20 1l-5 2Z\"/><path d=\"M2 26c4-7 15-11 23-6l8 6-11-1-6 2-8-1ZM13 17c6-7 16-6 22-1l-7 2-5-1-6 2Z\"/>"], ["归鹤", "<path opacity=\".3\" d=\"M4 8c9 1 14 8 16 13C10 18 7 13 4 8Z\"/><path d=\"M3 13c9 1 11 5 17 7 1-8 6-12 15-13-5 5-7 9-8 13l-7 5-3 8-2-2 2-7C10 22 6 18 3 13Z\"/><path d=\"M25 19l8-2 5 2-7 1-5 5Z\"/>"], ["曦光", "<circle cx=\"21\" cy=\"15\" r=\"10\" opacity=\".28\"/><path d=\"M11 17a10 10 0 0117-9c-8-4-13 1-14 9Z\"/><path d=\"M3 26c8-5 12-1 18-2 6-1 10-4 16-2-9 0-10 5-17 5-6 0-10-3-17-1Z\"/><path opacity=\".5\" d=\"M7 32c7-3 15 2 25-2-8 6-17 0-25 2Z\"/>"], ["清扇", "<path opacity=\".25\" d=\"M20 35L3 13Q20-4 37 13Z\"/><path d=\"M20 35L3 13l3-2 14 19L34 11l3 2Z\"/><path opacity=\".55\" d=\"M20 31L11 7l2-1 7 22 7-22 2 1Z\"/><path d=\"M19 5h2l-1 25Z\"/>"], ["荷香", "<path opacity=\".3\" d=\"M4 31c7-7 23-7 32 0-11 6-23 6-32 0Z\"/><path d=\"M20 25C10 21 8 15 10 10c8 3 10 8 10 15ZM21 25c0-9 3-14 10-16 3 7-3 13-10 16Z\"/><path opacity=\".6\" d=\"M20 22C15 13 16 8 21 3c5 7 5 12-1 19Z\"/><path d=\"M19 25h2l-1 8h-1Z\"/>"], ["月泊", "<path d=\"M27 5C11 0 4 18 13 27c5 5 10 4 14 2-10 2-16-6-14-14 2-6 6-9 14-10Z\"/><path opacity=\".28\" d=\"M29 8a12 12 0 010 19c5-7 4-12 0-19Z\"/><path opacity=\".6\" d=\"M4 34c9-4 20 2 33-2-12 7-23 0-33 2Z\"/>"]];
function logo(tid){const t=state.teams.find(t=>t.id===tid),url=t?.logo,index=Math.max(0,state.teams.findIndex(t=>t.id===tid))%defaultTeamIcons.length,[name,art]=defaultTeamIcons[index];return '<span class="team-logo">'+(url&&url.startsWith('/media/')?'<img src="'+esc(url)+'" alt="'+esc(t?.name||'队标')+'">':'<svg viewBox="0 0 40 40" role="img" aria-label="'+name+'" fill="currentColor">'+art+'<circle cx="35" cy="35" r="1.4" fill="#a34735" opacity=".8"/></svg>')+'</span>'}
function renderHistory(pid){const rows=state.history?.[pid]||[];if(!rows.length)return '<h3>历史成绩</h3><p class="muted">暂无历史成绩</p>';const chosen=rows.find(r=>r.eventId===historySelected[pid])||rows[0];const fmt=v=>v==null?'未知':Number(v).toFixed(2).replace(/\.00$/,'');return '<label>历史赛事<select id="history-select">'+rows.map(r=>'<option value="'+esc(r.eventId)+'" '+(r===chosen?'selected':'')+'>'+esc(r.name)+'</option>').join('')+'</select></label><div class="history-wrap"><table><thead><tr><th>阶段</th><th>场数</th><th>总 PT</th><th>场均 PT</th><th>平均顺位</th></tr></thead><tbody>'+chosen.stages.map(r=>'<tr><td>'+esc(r.name)+'</td><td>'+fmt(r.games)+'</td><td>'+fmt(r.total)+'</td><td>'+fmt(r.average)+'</td><td>'+fmt(r.avgRank)+'</td></tr>').join('')+'</tbody></table></div><p class="muted">按明确选手身份关联；缺失指标保留未知，不含阶段带入。</p>'}
const oldRenderAuction=renderAuction;
renderAuction=function(){oldRenderAuction();const d=state.draft,l=d.lot,c=d.candidates.find(c=>c.playerId===l.playerId);$('auction').innerHTML='<div class="hero"><div><span>'+(l.stage===3?'第三轮 · 补选分派':'当前竞拍选手')+'</span><h2>'+esc(player(l.playerId))+'</h2><p>起拍价 <b>'+l.startPrice+'</b> 预算点</p><div class="description">'+esc(c.description||'暂无介绍')+'</div></div><div id="history">'+renderHistory(l.playerId)+'</div><div><span>当前最高报价</span><strong class="quotation">'+(l.price??'—')+'</strong><p>'+ (l.leader?esc(team(l.leader)):'尚无出价')+'</p><strong>'+esc(({preview:'等待主持开始',bidding:'轮到 '+team(l.turn),'awaiting-confirm':l.stage===3?'等待管理员分派':l.leader?'等待确认成交':'无人有效出价，等待确认流拍',settled:l.outcome==='assigned'?'已分派至 '+team(l.assignedTeam):l.outcome==='sold'?'已成交':'已进入第三轮池'})[l.state])+'</strong></div></div>';if($('history-select'))$('history-select').onchange=e=>{historySelected[l.playerId]=e.target.value;render()};};
const oldRender=render;
render=function(){['teams','bar','feed'].forEach(id=>$(id).hidden=false);oldRender();document.body.classList.toggle('coach-view',!!state.myTeam&&!state.manager);if(state.myTeam&&!state.manager)$('auction').before($('pick'));else $('auction').after($('pick'));$('more').hidden=!state.manager;$('setup').hidden=!configOpen||state.status!=='setup'||!state.manager;$('more-panel').innerHTML=state.manager?'<b>'+ (state.public?'已公开 · 任何人可只读访问':'私有 · 仅管理员和绑定教练可访问')+'</b><p><button id="visibility">'+(state.public?'关闭公开访问':'公开给观众')+'</button>'+(state.status==='setup'?'<button id="configure-toggle">'+(configOpen?'收起配置':'编辑配置')+'</button><button id="refresh-config">刷新配置</button>':'')+(state.status!=='complete'?'<button id="undo-control">撤销上一步 · 先预览</button>':'')+((state.status==='setup'||state.status==='complete')&&state.eventId?'<button id="unlink-control">解除赛事关联</button>':'')+'</p>':'';if($('visibility'))$('visibility').onclick=async()=>{if(!state.public&&!await askConfirm('公开后，任何持有活动链接的人可查看名单和已公布选人信息。确认公开？'))return;send('publish',{public:!state.public})};if($('configure-toggle'))$('configure-toggle').onclick=()=>{configOpen=!configOpen;render()};if($('refresh-config'))$('refresh-config').onclick=async()=>{if(await askConfirm('刷新会放弃尚未保存的配置输入，继续？'))load(true)};if($('undo-control'))$('undo-control').onclick=()=>controlPreview('undo');if($('unlink-control'))$('unlink-control').onclick=async()=>{if(await askConfirm(state.status==='setup'?'解除关联会清空当前配置，审计保留。继续？':'解除关联保留最终阵容和审计，并允许在赛事管理中清理符合条件的测试赛事。继续？'))send('unlink')};
if(state.status==='setup'&&state.manager&&!configOpen){$('bar').querySelector('#save')?.remove();$('bar').insertAdjacentHTML('beforeend','<button id="open-config">编辑配置</button>');$('open-config').onclick=()=>{configOpen=true;render()}}
const d=state.draft;if(d){document.querySelectorAll('#teams .card').forEach((card,i)=>{const t=d.teams[i];const h=card.querySelector('h3');h.innerHTML=logo(t.teamId)+'<span>'+esc(team(t.teamId))+'</span>';card.classList.toggle('leading',d.lot?.leader===t.teamId);card.classList.toggle('responding',d.lot?.turn===t.teamId);if(d.lot?.leader===t.teamId&&d.lot.state==='awaiting-confirm'){const preview=document.createElement('p');preview.className='badge';preview.textContent='成交后余额 '+(t.balance-d.lot.price);card.appendChild(preview)}});
if(state.manager&&state.status==='active'&&(['auction-ready','third-ready','review-ready'].includes(d.phase)||(d.phase==='auction'&&(['settled','preview','awaiting-confirm'].includes(d.lot?.state))))){$('bar').insertAdjacentHTML('beforeend','<button id="finish-control">最终检查 / 结束</button>');$('finish-control').onclick=()=>controlPreview('finish')}
if(state.status==='complete'){$('phase').textContent='选人活动已结束';$('progress').textContent='最终阵容与预算只读保存；赛事仍可继续安排比赛。';$('bar').innerHTML='<strong>活动已结束 · 最终阵容</strong>';if(d.completion?.unassigned?.length)$('progress').textContent+=' 未分队：'+d.completion.unassigned.map(p=>p.name).join('、')}}
};
async function controlPreview(operation){try{const r=await request('/api/draft/'+id+'/',{action:'preview',operation,revision:state.revision}),p=r.preview;const box=$('preview-panel');box.hidden=false;box.innerHTML='<h2>'+(operation==='finish'?'最终检查':'撤销影响预览')+'</h2><p>'+esc(p.message)+'</p>'+(p.teams?'<ul>'+p.teams.map(t=>'<li>'+esc(t.name)+' · '+t.count+'/'+t.capacity+'人 · 余额 '+t.balance+'<br>'+t.members.map(esc).join('、')+'</li>').join('')+'</ul>':'')+(p.rosterChanges?'<p>将恢复到：'+esc(({setup:'准备',nomination:'一选提交',revealed:'一选公布',auction:'竞拍','auction-ready':'待抽取','third-ready':'第三轮待抽取','review-ready':'最终检查'})[p.phase]||'上一步')+' · 撤销 '+esc(({configure:'保存配置',start:'开始一选',nominate:'提交首选',reveal:'公布选择',roll:'冲突Roll',continue:'推进一选',draw:'抽取选手','draw-third':'抽取第三轮选手','open-bidding':'开始竞拍',bid:'报价',pass:'PASS','confirm-lot':'确认成交或流拍','assign-third':'确认分派','assign-second':'管理员分配','next-lot':'下一位'})[p.action]||'上一步操作')+'</p><ul>'+p.rosterChanges.map(r=>'<li>'+esc(r.player)+'：'+esc(r.fromTeam?team(r.fromTeam):'未分队')+' → '+esc(r.toTeam?team(r.toTeam):'未分队')+'</li>').join('')+'</ul><p>恢复余额：'+p.balances.map(t=>esc(team(t.teamId))+' '+t.balance).join(' / ')+'</p>':'')+(p.unassigned?.length?'<p>保持未分队：'+p.unassigned.map(x=>esc(x.name)).join('、')+'</p>':'')+'<button id="confirm-control" class="primary">确认'+(operation==='finish'?'结束活动':'撤销')+'</button> <button id="cancel-control">取消</button>';$('cancel-control').onclick=()=>box.hidden=true;$('confirm-control').onclick=async()=>{box.hidden=true;await send(operation,{previewToken:p.token})};box.scrollIntoView({behavior:'smooth',block:'center'})}catch(e){error(e)}}
$('more').onclick=()=>{$('more-panel').hidden=!$('more-panel').hidden};
window.addEventListener('online',()=>load(true));
window.addEventListener('offline',()=>{$('connection').textContent='连接中断 · 恢复后自动同步（不会自动 PASS）'});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)load()});
(async()=>{await load(true);timer=setInterval(()=>load(),2000)})();

</script>{% include 'site-credit.html' %}</body></html>
