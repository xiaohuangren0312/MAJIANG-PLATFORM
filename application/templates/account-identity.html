{% if request.user.is_authenticated %}
<details class="account-menu">
<summary class="account-identity" aria-label="账号菜单"><span>{{ request.user.username }}</span><small>{{ header_account_role }}</small></summary>
<div class="account-dropdown">
<a href="/" {% if header_portal == 'public' %}aria-current="page"{% endif %}>观众端</a>
{% if header_can_manage %}<a href="/manage/" {% if header_portal == 'manage' %}aria-current="page"{% endif %}>管理端</a>{% endif %}
{% if header_can_coach %}<a href="/coach/lineups/" {% if header_portal == 'coach' %}aria-current="page"{% endif %}>教练端</a>{% endif %}
<div class="account-menu-divider"></div><a href="/account/">账号设置</a>
{% if draft_navigation %}<a href="/login/?next={{ request.path|urlencode }}">切换账号</a>{% endif %}
<form method="post" action="/logout/">{% csrf_token %}<button type="submit">退出登录</button></form>
</div></details>
<style>
header .account-menu{position:relative;flex:0 0 auto;margin:0 0 0 auto;padding:0;border:0;color:inherit}
header .account-menu>summary.account-identity{display:flex;flex-direction:column;align-items:flex-start;gap:2px;max-width:190px;padding:7px 12px;cursor:pointer;list-style:none;border-radius:7px;line-height:1.5;color:inherit;background:transparent;border:0;font-size:13px;text-decoration:none}
header .account-menu>summary::-webkit-details-marker{display:none}
header .account-menu>summary.account-identity>small{border:0;padding:0;margin:0;font-size:10px;opacity:.7;color:inherit}
header .account-menu[open]>summary,header .account-menu>summary:hover{background:#9a88751a}
header .account-dropdown{position:absolute;right:0;top:calc(100% + 9px);width:180px;max-width:calc(100vw - 32px);padding:7px;border:1px solid #ded6c9;border-radius:10px;background:#fffdf8;color:#272522;box-shadow:0 12px 36px #211b1926;z-index:100}
header .account-dropdown>a,header .account-dropdown form>button{display:flex;width:100%;min-height:40px;align-items:center;justify-content:flex-start;margin:0;padding:10px 12px;box-sizing:border-box;font:500 13px/1.4 system-ui;color:#39312a;background:transparent;border:0;border-radius:6px;text-decoration:none;cursor:pointer}
header .account-menu .account-dropdown>a:hover,header .account-menu .account-dropdown>a:focus-visible{background:#f0eae0;color:#39312a}
header .account-menu .account-dropdown>a[aria-current=page]:hover{color:#a6372b}
header .account-dropdown>a[aria-current=page]{background:#eee8df;color:#a6372b;font-weight:650}
header .account-dropdown form{margin:0;padding:0}
header .account-menu .account-dropdown form>button{color:#a6372b;background:transparent;opacity:1}
header .account-menu .account-dropdown form>button:hover{color:#922d23;background:#f5e9e4}
.account-menu-divider{height:1px;background:#e5ded2;margin:6px 5px}
header .account-menu summary:focus-visible{outline:2px solid #ba3c30;outline-offset:2px}
@media(max-width:600px){header .account-menu>summary.account-identity{max-width:140px;padding:6px 8px}header .account-dropdown>a,header .account-dropdown form>button{min-height:44px}}
</style>
<script>
if(!window.hqlAccountMenuBound){window.hqlAccountMenuBound=true;
document.addEventListener('click',e=>document.querySelectorAll('.account-menu[open]').forEach(m=>{if(!m.contains(e.target))m.open=false}));
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelectorAll('.account-menu[open]').forEach(m=>{m.open=false;m.querySelector('summary').focus()})});}
</script>
{% endif %}
